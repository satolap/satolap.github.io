name: Build and deploy the site

# Builds https://satolap.github.io from tools/build.py: the satolap home page, the terraform-msgraph-modules
# docs and one page per verified module, rendered from the module READMEs of the latest public release of
# satolap/terraform-msgraph-modules. The generated pages are deployed, never committed.
#
# - push to main or a manual run: always build and deploy.
# - schedule: every 3 hours, deploy only when a newer release exists than the one the live site was built from.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            python3 tools/build.py --check
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build.py
      - name: Check internal links and the public-facts guard
        run: python3 tools/build.py --verify
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
